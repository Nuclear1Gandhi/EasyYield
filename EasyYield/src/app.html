<!-- src/app.html -->
<!doctype html>
<html lang="en" class="%sveltekit.theme%">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <meta
      name="description"
      content="EasyYield - Radix DeFi Yield Calculator and Optimization Tool"
    />

    <script>
      function themeInit() {
        try {
          const stored = localStorage.getItem('theme');
          const osDark =
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches;
          const theme = stored || (osDark ? 'dark' : 'light');
          const root = document.documentElement;
          root.setAttribute('data-theme', theme); // for SCSS variables
          root.classList.toggle('dark', theme === 'dark'); // for Tailwind/Flowbite
        } catch (e) {
          // // Fallback: default to dark if error
          document.documentElement.setAttribute('data-theme', 'dark');
          document.documentElement.classList.add('dark');
        }
      }

      themeInit();
    </script>

    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover" class="bg-gray-50 dark:bg-gray-900">
    <div style="display: contents" class="app">%sveltekit.body%</div>
  </body>
</html>
